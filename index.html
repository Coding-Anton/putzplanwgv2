<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WG-Putzplan (Einfache Version)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px 30px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5em;
        }
        .content {
            padding: 30px;
        }
        h2 {
            margin-top: 0;
            color: #007bff;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        li {
            font-size: 1.2em;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        li.is-current {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 123, 255, 0.2);
        }
        .skip-counter {
            font-weight: bold;
            color: #dc3545;
            margin-left: 8px;
        }
        .actions {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            font-size: 1em;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }
        #done-button {
            background-color: #28a745;
            color: white;
        }
        #done-button:hover {
            background-color: #218838;
        }
        #skip-button {
            background-color: #ffc107;
            color: #333;
        }
        #skip-button:hover {
            background-color: #e0a800;
        }
        .whatsapp-action {
            margin-top: 30px;
            text-align: center;
        }
        #whatsapp-button {
            background-color: #25D366;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container" id="main-content" style="visibility: hidden;">
        <header>
            <h1>WG-Putzplan</h1>
        </header>
        <div class="content">
            <h2>Reihenfolge</h2>
            <ul id="person-list">
                </ul>

            <div class="actions">
                <button id="done-button">Dienst erledigt</button>
                <button id="skip-button">Dienst überspringen</button>
            }
            </div>

            <div class="whatsapp-action">
                <a id="whatsapp-button" href="#" target="_blank">In WhatsApp erinnern</a>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="position: fixed; inset: 0; background: white; display: flex; align-items: center; justify-content: center; font-family: sans-serif; color: #555;">
        <p>Verbinde mit Putzplan...</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // === HIER DEINE FIREBASE CONFIG EINFÜGEN ===
        const firebaseConfig = {
            apiKey: "AIzaSyCyeReWBevS69MUdApFZAM6AQ_lulfO8Zg",
            authDomain: "wg-putzplanv2.firebaseapp.com",
            projectId: "wg-putzplanv2",
            storageBucket: "wg-putzplanv2.appspot.com",
            messagingSenderId: "12646186977",
            appId: "1:12646186977:web:b3913f027908e2143f9ca0",
            measurementId: "G-1767FJRQLQ"
        };
        // ==================================

        // Firebase initialisieren
        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) {
            console.error("Firebase Init failed:", e);
            document.getElementById("loading-overlay").innerHTML = "Firebase-Konfiguration fehlgeschlagen. Prüfe die Config.";
        }
        
        const db = firebase.firestore();

        // Referenzen zu den Collections
        const peopleCollection = db.collection("people");
        const configDoc = db.doc("config/state");

        // DOM-Elemente
        const personListEl = document.getElementById("person-list");
        const doneButton = document.getElementById("done-button");
        const skipButton = document.getElementById("skip-button");
        const whatsappButton = document.getElementById("whatsapp-button");
        const loadingOverlay = document.getElementById("loading-overlay");
        const mainContent = document.getElementById("main-content");

        let currentPeople = [];
        let currentState = {};
        let isProcessingRotation = false; // Sperre

        /**
         * Hilfsfunktion: Findet den Montag, 00:00 Uhr, der aktuellen Kalenderwoche.
         */
        function getMondayOfThisWeek(date) {
            const d = new Date(date);
            // 0=Sonntag, 1=Montag, ..., 6=Samstag
            const day = d.getDay(); 
            // Logik, um zum Montag zu kommen:
            // Wenn Sonntag (0), gehe 6 Tage zurück.
            // Wenn Montag (1), gehe 0 Tage zurück.
            // Wenn Dienstag (2), gehe 1 Tag zurück.
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            const monday = new Date(d.setDate(diff));
            monday.setHours(0, 0, 0, 0); // Wichtig: Auf Mitternacht setzen
            return monday;
        }

        // Listener für den globalen Status
        configDoc.onSnapshot(async (doc) => {
            console.log("Config Snapshot empfangen...");
            if (isProcessingRotation) {
                console.log("Rotation läuft, Snapshot ignoriert.");
                return; 
            }

            if (!doc.exists) {
                console.error("Config-Dokument 'config/state' nicht gefunden! Initialisiere...");
                loadingOverlay.innerHTML = "Initialisiere Putzplan...";
                await configDoc.set({ 
                    currentOrderIndex: 0,
                    lastRotationTimestamp: new Date(0) 
                });
                return; // Snapshot wird neu ausgelöst
            }

            currentState = doc.data();

            // Initialisiere Datum, falls es fehlt.
            if (!currentState.lastRotationTimestamp) {
                console.log("Initialisiere lastRotationTimestamp...");
                isProcessingRotation = true;
                await configDoc.set({ lastRotationTimestamp: new Date(0) }, { merge: true });
                isProcessingRotation = false;
                return; // Snapshot wird neu ausgelöst
            }

            // --- KORRIGIERTE Auto-Rotations-Logik ---
            const mondayOfThisWeek = getMondayOfThisWeek(new Date());
            const lastRotationDate = currentState.lastRotationTimestamp.toDate();

            if (lastRotationDate.getTime() < mondayOfThisWeek.getTime()) {
                console.log("Neue Kalenderwoche erkannt! Führe automatische Rotation durch...");
                isProcessingRotation = true;
                // 'false' = "erledigt", nicht "übersprungen"
                await advanceWeek(false); 
                isProcessingRotation = false; 
                return; // Snapshot wird neu ausgelöst (und rendert dann)
            }
            
            console.log("Rendere Personen...");
            renderPeople();
            
            // Ladebildschirm ausblenden
            loadingOverlay.style.display = "none";
            mainContent.style.visibility = "visible";

        }, (error) => {
            console.error("FEHLER beim Laden von configDoc:", error);
            loadingOverlay.innerHTML = "Fehler: Konnte Status nicht laden. Prüfe Firestore-Regeln und Verbindung.";
        });

        // Listener für die Personen
        peopleCollection.orderBy("order").onSnapshot((snapshot) => {
            console.log("People Snapshot empfangen...");
            currentPeople = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderPeople();
        }, (error) => {
            console.error("FEHLER beim Laden von peopleCollection:", error);
            loadingOverlay.innerHTML = "Fehler: Konnte Personenliste nicht laden. Prüfe Firestore-Regeln und 'people'-Collection.";
        });

        function renderPeople() {
            if (!currentState.hasOwnProperty('currentOrderIndex') || currentPeople.length === 0) {
                console.log("Warte auf Daten zum Rendern...");
                return;
            }

            personListEl.innerHTML = "";
            let currentPersonName = "";

            currentPeople.forEach(person => {
                const li = document.createElement("li");
                
                let nameHtml = person.name;
                if (person.skipCount > 0) {
                    nameHtml += ` <span class="skip-counter">(${person.skipCount})</span>`;
                }
                
                li.innerHTML = nameHtml;

                if (person.order === currentState.currentOrderIndex) {
                    li.classList.add("is-current");
                    currentPersonName = person.name;
                }
                personListEl.appendChild(li);
            });
            
            // WhatsApp-Button aktualisieren
            const whatsappMessage = encodeURIComponent(`Hey WG! Diese Woche ist ${currentPersonName} mit dem Putzdienst dran.`);
            whatsappButton.href = `whatsapp://send?text=${whatsappMessage}`;
        }

        // Button-Listener.
        doneButton.addEventListener("click", () => advanceWeek(false));
        skipButton.addEventListener("click", () => advanceWeek(true));

        async function advanceWeek(wasSkipped) {
            console.log(`advanceWeek gestartet (skipped: ${wasSkipped})`);
            if (isProcessingRotation) return; 
            isProcessingRotation = true;

            const currentPerson = currentPeople.find(p => p.order === currentState.currentOrderIndex);
            
            if (!currentPerson) {
                console.error("Konnte aktuelle Person nicht finden!");
                isProcessingRotation = false;
                return;
            }

            try {
                // 1. Update den Skip-Status der aktuellen Person (falls übersprungen)
                if (wasSkipped) {
                    const newSkipCount = (currentPerson.skipCount || 0) + 1;
                    await peopleCollection.doc(currentPerson.id).update({ skipCount: newSkipCount });
                }

                // 2. Finde die NÄCHSTE Person (mit "Vormerk"-Logik)
                const skippedPeople = currentPeople
                    .filter(p => p.skipCount > 0 && p.id !== currentPerson.id)
                    .sort((a, b) => a.order - b.order);

                let nextPerson;

                if (skippedPeople.length > 0) {
                    console.log("Nimm nächste Person aus Skip-Liste.");
                    nextPerson = skippedPeople[0];
                    const newSkipCount = nextPerson.skipCount - 1;
                    await peopleCollection.doc(nextPerson.id).update({ skipCount: newSkipCount });
                } else {
                    console.log("Nimm nächste Person aus normaler Rotation.");
                    const nextIndex = (currentState.currentOrderIndex + 1) % currentPeople.length;
                    nextPerson = currentPeople.find(p => p.order === nextIndex);
                }

                // 3. Setze den globalen Status auf die neue Person UND das NEUE DATUM ("jetzt")
                if (nextPerson) {
                    await configDoc.update({ 
                        currentOrderIndex: nextPerson.order,
                        lastRotationTimestamp: new Date() // WICHTIG! Setzt den Timer neu.
                    });
                }
            } catch (e) {
                console.error("Fehler in advanceWeek:", e);
                alert("Ein Fehler ist aufgetreten. Bitte Seite neu laden.");
            }
            
            console.log("Rotation abgeschlossen.");
            isProcessingRotation = false;
        }

        // Fange alle nicht behandelten Fehler ab
        window.addEventListener('error', function(event) {
            console.error('Globaler FEHLER:', event.message, event.filename, event.lineno);
            loadingOverlay.innerHTML = `Ein unerwarteter Fehler ist aufgetreten: ${event.message}`;
        });
    </script>

</body>
</html>
